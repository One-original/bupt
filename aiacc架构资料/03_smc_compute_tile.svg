<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <style>
      .t{font-family:'Microsoft YaHei','Segoe UI',Arial,sans-serif;fill:#18324B}.title{font-size:30px;font-weight:700}.sub{font-size:15px;fill:#5B6B7C}.h{font-size:17px;font-weight:700}.b{font-size:16px;font-weight:600}.s{font-size:13px;fill:#42586B}.xs{font-size:12px;fill:#5B6B7C}.plane{fill:#F7FAFC;stroke:#CBD7E2;stroke-width:1.5}.ctrl{fill:#F1EBFF;stroke:#7046C7;stroke-width:2}.data{fill:#E6F7F8;stroke:#007C91;stroke-width:2}.mem{fill:#FFF3E9;stroke:#E98236;stroke-width:2}.fu{fill:#EEF4FF;stroke:#2D70B7;stroke-width:2}.ext{fill:#F4F6F8;stroke:#68798A;stroke-width:2}.line-c{fill:none;stroke:#7046C7;stroke-width:2.3;marker-end:url(#ac)}.line-d{fill:none;stroke:#007C91;stroke-width:3;marker-end:url(#ad)}.line-m{fill:none;stroke:#E98236;stroke-width:3;marker-end:url(#am)}.dash{fill:none;stroke:#7046C7;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#ac)}.ret{fill:none;stroke:#64748B;stroke-width:2;stroke-dasharray:5 5;marker-end:url(#ar)}
    </style>
    <marker id="ac" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#7046C7"/></marker>
    <marker id="ad" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#007C91"/></marker>
    <marker id="am" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#E98236"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#64748B"/></marker>
  </defs>
  <rect width="1600" height="980" fill="#FFFFFF"/>
  <text x="54" y="58" class="t title">SMC Compute Tile — Control, Vector Data Path &amp; Local Storage</text>
  <text x="54" y="84" class="t sub">一张 Tile 图要回答：微指令如何进入、操作数如何从 UR 取出并路由、计算结果如何安全写回</text>
  <rect x="187" y="130" width="1177" height="740" rx="16" fill="#FCFDFE" stroke="#18324B" stroke-width="2.5"/>
  <text x="219" y="167" class="t h">SMC TILE [i]</text>
  <rect x="218" y="190" width="1115" height="188" rx="12" class="plane"/>
  <text x="244" y="222" class="t h" fill="#7046C7">CONTROL / ISSUE PLANE</text>
  <rect x="218" y="404" width="1115" height="414" rx="12" class="plane"/>
  <text x="244" y="436" class="t h" fill="#007C91">128-BIT VECTOR DATA PATH + BANKED LOCAL STORAGE</text>

  <rect x="45" y="267" width="111" height="70" rx="8" class="ext"/>
  <text x="73" y="296" class="t b">IQ[i]</text><text x="58" y="320" class="t xs">micro-op + tag</text>
  <rect x="254" y="262" width="171" height="84" rx="8" class="ctrl"/>
  <text x="292" y="293" class="t b">IQ Fetch / Latch</text><text x="281" y="320" class="t s">valid / ready</text>
  <rect x="474" y="246" width="178" height="116" rx="8" class="ctrl"/>
  <text x="519" y="278" class="t b">CRU Decode</text><text x="501" y="306" class="t s">opcode / fields</text><text x="501" y="330" class="t s">src / dst / format</text>
  <rect x="701" y="246" width="182" height="116" rx="8" class="ctrl"/>
  <text x="729" y="278" class="t b">StateTable</text><text x="727" y="306" class="t s">WAW / pending tag</text><text x="727" y="330" class="t s">dependency check</text>
  <rect x="932" y="246" width="182" height="116" rx="8" class="ctrl"/>
  <text x="959" y="278" class="t b">Issue Control</text><text x="959" y="306" class="t s">FU select / enable</text><text x="959" y="330" class="t s">pipe / stall / flush</text>
  <rect x="1163" y="262" width="135" height="84" rx="8" class="ctrl"/>
  <text x="1190" y="293" class="t b">WB Arbiter</text><text x="1190" y="320" class="t xs">tag / order</text>

  <rect x="48" y="599" width="108" height="95" rx="8" class="ext"/>
  <text x="72" y="630" class="t b">LDB / STB</text><text x="66" y="656" class="t xs">NoC / HBM</text><text x="67" y="678" class="t xs">128-bit data</text>
  <rect x="254" y="546" width="350" height="189" rx="9" class="mem"/>
  <text x="349" y="580" class="t b">UR Scratchpad (banked)</text>
  <rect x="278" y="605" width="64" height="91" rx="5" fill="#FFF9F3" stroke="#E98236"/><text x="286" y="639" class="t xs">Bank 0</text><text x="292" y="666" class="t xs">R/W</text>
  <rect x="354" y="605" width="64" height="91" rx="5" fill="#FFF9F3" stroke="#E98236"/><text x="362" y="639" class="t xs">Bank 1</text><text x="368" y="666" class="t xs">R/W</text>
  <rect x="430" y="605" width="64" height="91" rx="5" fill="#FFF9F3" stroke="#E98236"/><text x="438" y="639" class="t xs">Bank 2</text><text x="444" y="666" class="t xs">R/W</text>
  <rect x="506" y="605" width="74" height="91" rx="5" fill="#FFF9F3" stroke="#E98236"/><text x="512" y="639" class="t xs">Bank N</text><text x="522" y="666" class="t xs">R/W</text>
  <text x="297" y="717" class="t xs">bank conflict / alignment / address generation</text>

  <rect x="656" y="535" width="177" height="151" rx="9" class="data"/>
  <text x="702" y="568" class="t b">RtoVR</text><text x="682" y="595" class="t s">source select</text><text x="682" y="619" class="t s">128-bit route</text><text x="682" y="643" class="t s">ShiftUp / Down</text><text x="682" y="667" class="t s">cross-tile input</text>
  <rect x="885" y="482" width="194" height="72" rx="8" class="fu"/>
  <text x="942" y="512" class="t b">FPMUL</text><text x="911" y="536" class="t xs">FP16 / FP32 lanes</text>
  <rect x="885" y="580" width="194" height="72" rx="8" class="fu"/>
  <text x="927" y="610" class="t b">FPADD / Reduce</text><text x="920" y="634" class="t xs">adder tree / accumulate</text>
  <rect x="885" y="678" width="194" height="72" rx="8" class="fu"/>
  <text x="924" y="708" class="t b">CVT / INT / LOGIC</text><text x="932" y="732" class="t xs">format conversion</text>
  <rect x="1133" y="565" width="164" height="122" rx="8" class="data"/>
  <text x="1171" y="598" class="t b">Result Mux</text><text x="1158" y="625" class="t s">select / pack</text><text x="1158" y="649" class="t s">valid + tag</text><text x="1158" y="673" class="t s">exception flags</text>
  <rect x="1133" y="718" width="164" height="54" rx="8" class="ctrl"/>
  <text x="1165" y="751" class="t b">WB FIFO</text>
  <rect x="1404" y="596" width="142" height="94" rx="8" class="ext"/>
  <text x="1430" y="627" class="t b">Neighbor</text><text x="1419" y="653" class="t s">SMC / NoC</text><text x="1422" y="676" class="t xs">broadcast / shift</text>

  <path d="M156 302 H254" class="line-c"/><path d="M425 304 H474" class="line-c"/><path d="M652 304 H701" class="line-c"/><path d="M883 304 H932" class="line-c"/><path d="M1114 304 H1163" class="line-c"/>
  <path d="M563 362 V488 H744 V535" class="dash"/><path d="M1023 362 V459 H982 V482" class="dash"/><path d="M1023 459 V580" class="dash"/><path d="M1023 459 V678" class="dash"/>
  <path d="M792 362 V506 H1215 V565" class="dash"/><text x="802" y="490" class="t xs" fill="#7046C7">dest-reg reservation / completion tag</text>
  <path d="M156 647 H254" class="line-m"/><path d="M604 620 H656" class="line-d"/>
  <path d="M833 610 H885" class="line-d"/><path d="M833 610 H858 V518 H885" class="line-d"/><path d="M833 610 H858 V714 H885" class="line-d"/>
  <path d="M1079 518 H1110 V626 H1133" class="line-d"/><path d="M1079 616 H1133" class="line-d"/><path d="M1079 714 H1110 V626 H1133" class="line-d"/>
  <path d="M1215 687 V718" class="line-c"/><path d="M1133 745 H1040 V735 H604" class="line-d"/><path d="M1040 735 H156 V647" class="line-m"/>
  <path d="M1297 626 H1404" class="line-d"/><path d="M1404 672 H1350 V655 H833" class="line-d"/>
  <path d="M1215 718 V404 H792 V362" class="ret"/><text x="925" y="397" class="t xs">completion / exception / backpressure</text>
  <text x="54" y="918" class="t s">讲图顺序：IQ 微指令入 Tile → CRU/StateTable 判定能否发射 → UR 取数经 RtoVR 路由 → 功能单元流水执行 → Result Mux/WB-FIFO 按 tag 写回 UR 或外部存储。</text>
</svg>
